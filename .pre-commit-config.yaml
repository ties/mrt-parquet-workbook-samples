# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-added-large-files
  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.9.4
    hooks:
      # update the lockfile
      - id: uv-lock
  -   repo: local
      hooks:
      # also manages the generation of exported requiremnts.txt file
      - id: fix-requirements
        name: fix extra-index-urls in generated requirements.txt
        language: system
        entry: uv run python fix_requirements.py requirements.txt
        files: ^(requirements.txt|uv.lock)$
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.1
    hooks:
    # run linter + formatter
    - id: ruff
      args: [ --fix ]
    - id: ruff-format
